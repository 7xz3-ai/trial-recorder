<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Eagle group -->
  <g transform="translate(5, 2) scale(0.88)">
    <!-- Gradient definition -->
    <defs>
      <linearGradient id="eagleGrad" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%" stop-color="#0077B6"/>
        <stop offset="100%" stop-color="#00AEEF"/>
      </linearGradient>
    </defs>

    <!-- Left wing (viewer's left) -->
    <path d="
      M 50 55
      C 42 50 28 42 18 34
      C 12 29 10 22 14 18
      C 18 14 24 16 28 20
      C 24 14 26 7 32 6
      C 38 5 42 10 42 16
      C 42 10 46 5 52 6
      C 57 7 59 13 57 19
      C 60 14 66 12 70 16
      C 74 20 72 27 67 32
      C 60 38 54 46 52 56
      Z
    " fill="url(#eagleGrad)"/>

    <!-- Right wing (viewer's right) -->
    <path d="
      M 58 55
      C 66 50 80 42 90 34
      C 96 29 98 22 94 18
      C 90 14 84 16 80 20
      C 84 14 82 7 76 6
      C 70 5 66 10 66 16
      C 66 10 62 5 56 6
      C 51 7 49 13 51 19
      C 48 14 42 12 38 16
      C 34 20 36 27 41 32
      C 48 38 54 46 56 56
      Z
    " fill="url(#eagleGrad)"/>

    <!-- Body -->
    <path d="
      M 38 52
      C 36 60 36 70 38 78
      C 42 88 50 96 54 98
      C 58 96 66 88 70 78
      C 72 70 72 60 70 52
      C 66 48 60 46 54 46
      C 48 46 42 48 38 52
      Z
    " fill="url(#eagleGrad)"/>

    <!-- Neck -->
    <path d="M 48 46 C 46 38 47 30 54 26 C 61 30 62 38 60 46 Z" fill="url(#eagleGrad)"/>

    <!-- Head -->
    <path d="
      M 54 26
      C 48 26 43 22 42 17
      C 41 12 44 8 48 7
      C 47 4 50 2 53 4
      C 54 2 57 2 58 4
      C 61 2 64 4 63 7
      C 67 8 70 12 69 17
      C 68 22 63 26 57 26
      Z
    " fill="url(#eagleGrad)"/>

    <!-- Beak - pointing right -->
    <path d="M 63 8 C 68 6 74 9 73 14 C 72 18 66 19 63 16 Z" fill="url(#eagleGrad)"/>

    <!-- Eye -->
    <circle cx="61" cy="12" r="2" fill="#0D1B2E"/>
    <circle cx="61.6" cy="11.4" r="0.7" fill="white"/>

    <!-- Left wing lower feathers / talons -->
    <path d="M 40 74 C 32 76 24 72 22 65 C 28 70 26 78 34 77 C 30 83 34 90 42 87 L 46 74 Z" fill="url(#eagleGrad)"/>

    <!-- Right wing lower feathers / talons -->
    <path d="M 68 74 C 76 76 84 72 86 65 C 80 70 82 78 74 77 C 78 83 74 90 66 87 L 62 74 Z" fill="url(#eagleGrad)"/>
  </g>

  <!-- BARCLAYS wordmark -->
  <text
    x="108"
    y="72"
    font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"
    font-size="58"
    font-weight="900"
    letter-spacing="1"
    fill="#00AEEF"
  >BARCLAYS</text>
</svg>
